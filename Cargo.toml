[package]
name = "lumen"
version = "0.10.1"
edition = "2021"
description = "Single-binary browser service for agents and humans"
license = "Apache-2.0"
repository = "http://vigilance:3002/blackopsrepl/lumen"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chromiumoxide = "0.9.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
libc = "0.2"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
