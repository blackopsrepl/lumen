[package]
name = "lumen"
version = "0.13.3"
edition = "2021"
description = "Single-binary session service for agents and humans"
license = "GPL-3.0-or-later"
repository = "http://vigilance:3002/blackopsrepl/lumen"

[workspace]
members = ["crates/lumen-ratatui"]
resolver = "2"

[dependencies]
anyhow = "1.0.104"
atspi = { version = "0.30.0", features = ["tokio", "zbus"] }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
chromiumoxide = "0.9.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
jpeg-encoder = "0.7.1"
libc = "0.2"
lumen-ratatui = { path = "crates/lumen-ratatui", default-features = false }
png = "0.18.1"
portable-pty = "0.9"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
vt100 = "0.16"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
