[package]
name = "lumen"
version = "0.1.0"
edition = "2021"
description = "Single-binary browser service for agents and humans"
license = "Apache-2.0"
repository = "http://vigilance:3002/blackopsrepl/lumen"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
