name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: rust
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      # Keep this job on the same Playwright/Ubuntu runtime as GitHub CI. The
      # runner image only supplies the Docker executor and is not the test OS.
      - name: Toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl build-essential pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Desktop dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends software-properties-common sway wtype grim
          add-apt-repository -y ppa:avengemedia/danklinux
          for source in /etc/apt/sources.list.d/*danklinux*.sources; do
            sed -i 's/noble/questing/g' "$source"
          done
          printf '%s\n' \
            'deb http://archive.ubuntu.com/ubuntu/ questing main universe' \
            'deb http://archive.ubuntu.com/ubuntu/ questing-updates main universe' \
            'deb http://security.ubuntu.com/ubuntu questing-security main universe' \
            > /etc/apt/sources.list.d/ubuntu-questing.list
          apt-get update
          apt-get install -y --no-install-recommends quickshell
          command -v sway
          command -v quickshell
          command -v wtype
          command -v grim

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      # The `rust` runner is expected to provide Node and a Chromium build;
      # .github/workflows/ci.yml installs them explicitly on a clean runner.
      - name: Viewer E2E
        run: make ui-test
