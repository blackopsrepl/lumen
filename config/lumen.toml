host = "127.0.0.1"
port = 8899
max_agents = 8
data_dir = "/data/agents"
chrome_bin = "chromium"
feedback_db = "/data/feedback.db"
audit_retain = 10000

[default_viewport]
width = 1440
height = 900

# Navigation host policy. Enforced per tab, inside the browser, on every tab
# Lumen mediates (creates, activates, or adopts while switching) — regardless
# of which CDP session drives the tab. Tabs an agent creates without Lumen's
# API are not checked until Lumen's API touches them.
[policy]
allow_hosts = []
blocked_hosts = []
