host = "127.0.0.1"
port = 8899
max_agents = 8
# Root for ephemeral per-session profiles. Lumen owns <data_dir>/run: one
# directory per session, removed when the session ends and cleared at startup.
# Runtime state therefore never outlives a session.
data_dir = "/data/agents"
chrome_bin = "chromium"
sway_bin = "sway"
quickshell_bin = "quickshell"
wtype_bin = "wtype"
# Each desktop session gets its own D-Bus so a Qt application can publish an
# accessibility tree scoped to that session.
dbus_bin = "dbus-daemon"
# The AT-SPI registry daemon. Unset searches the usual libexec locations;
# set it when at-spi2-registryd lives elsewhere.
# at_spi_registryd = "/usr/libexec/at-spi2/at-spi2-registryd"
# Grid a ratatui session starts at. The app links lumen-ratatui and renders
# into this many columns and rows; the viewer scales it to fit.
tui_cols = 120
tui_rows = 40
feedback_db = "/data/feedback.db"
audit_retain = 10000

[default_viewport]
width = 1440
height = 900

# Navigation host policy. Enforced per tab, inside the browser, on every tab
# Lumen mediates (creates, activates, or adopts while switching) — regardless
# of which CDP session drives the tab. Tabs an agent creates without Lumen's
# API are not checked until Lumen's API touches them.
[policy]
allow_hosts = []
blocked_hosts = []
