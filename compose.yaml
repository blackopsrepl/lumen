# Production Compose stack for the Playwright browser server (architecture "B").
#
# The container runs one isolated Chromium per agent and exposes each on its
# own loopback CDP port. The agent's host-side `playwright-cli` attaches to it:
#
#   bin/up.sh                 # start the browser broker
#   bin/session.sh <agent>    # create+attach that agent's browser (host CLI)
#   playwright-cli -s=<agent> goto https://example.com
#   bin/dashboard.sh          # live, annotatable dashboard on localhost
#
# Host networking is required: Chromium's CDP binds 127.0.0.1 inside the
# container, and the host-side CLI must reach that same loopback.
#
# Values are substituted from the shell environment or ./.env. See .env.example.

x-podman:
  in_pod: false

services:
  browser-broker:
    image: localhost/playwright-browser:${PLAYWRIGHT_IMAGE_VERSION:-1.63.0}
    build:
      context: .
      dockerfile: Containerfile
      args:
        PLAYWRIGHT_IMAGE_VERSION: ${PLAYWRIGHT_IMAGE_VERSION:-1.63.0}
    container_name: browser-broker
    hostname: browser-broker
    restart: unless-stopped
    init: true
    network_mode: host
    shm_size: "1gb"
    stop_grace_period: 20s
    # Chromium runs with --no-sandbox (required rootless), so forbid any
    # privilege gain from inside the container as a compensating control.
    security_opt:
      - no-new-privileges:true
    # One Chromium per agent, each forking helpers: keep this generous.
    pids_limit: 16384
    # Memory/CPU limits need the cpu and memory cgroup controllers delegated to
    # your user; this host delegates only `pids`, so they stay unset.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "playwright-browser-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      BROKER_HOST: "127.0.0.1"
      BROKER_PORT: "${BROKER_PORT:-8090}"
      AGENT_DATA_DIR: /data/agents
      AGENT_HEADLESS: "${AGENT_HEADLESS:-1}"
      AGENT_NO_SANDBOX: "${AGENT_NO_SANDBOX:-1}"
      MAX_AGENTS: "${MAX_AGENTS:-8}"
      AGENT_EXTRA_ARGS: ${AGENT_EXTRA_ARGS:-}
      CHROME_BIN: chromium
      TZ: ${TZ:-UTC}
    volumes:
      - browser-data:/data

volumes:
  browser-data:
