# Lumen: one service, one binary, one port.
#
# Host networking is required so the loopback DevTools ports of each agent's
# Chromium stay reachable by the host-side `playwright-cli`, which attaches to
# the same browsers Lumen manages.

x-podman:
  in_pod: false

services:
  lumen:
    image: localhost/lumen:${LUMEN_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: Containerfile
      args:
        PLAYWRIGHT_IMAGE_VERSION: ${PLAYWRIGHT_IMAGE_VERSION:-1.63.0}
        LUMEN_REVISION: ${LUMEN_REVISION:-unknown}
    container_name: lumen
    hostname: lumen
    restart: unless-stopped
    init: true
    network_mode: host
    extra_hosts:
      - "host.containers.internal:127.0.0.1"
      - "host.docker.internal:127.0.0.1"
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    pids_limit: 16384
    # Memory/CPU limits need the cpu and memory cgroup controllers delegated to
    # your user; this host delegates only `pids`, so they stay unset.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch(`http://127.0.0.1:${LUMEN_PORT:-8899}/healthz`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      LUMEN_CONFIG: /etc/lumen/lumen.toml
      LUMEN_PORT: ${LUMEN_PORT:-8899}
      LUMEN_CHROME: ${LUMEN_CHROME:-chromium}
      # Deliberately not ${RUST_LOG}: a globally exported RUST_LOG in the
      # operator's shell would silently override the service's log level.
      RUST_LOG: ${LUMEN_LOG:-lumen=info}
      TZ: ${TZ:-UTC}
    volumes:
      - lumen-data:/data

volumes:
  lumen-data:
    name: lumen-browser-data
