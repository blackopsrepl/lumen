name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag only becomes a release after the same gates a push to the default branch must pass.
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Notes come from the tag's own CHANGELOG section, which
      # commit-and-tag-version wrote when it cut the release. The extraction
      # lives in scripts/release-notes.py rather than inline here: it fails
      # closed, so a release is never published with an empty body.
      - name: Publish release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release-notes.py "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
