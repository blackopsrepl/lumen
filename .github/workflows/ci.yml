name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reused by release.yml so a tag cannot publish without passing these gates.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The same gates the Forgejo workflow runs; the Makefile owns their order.
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Test dependencies
        run: |
          npm ci
          # GitHub runners do not ship Chromium's runtime libraries.
          npx playwright install-deps chromium

      - name: Desktop dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common sway wtype grim
          sudo add-apt-repository -y ppa:avengemedia/danklinux
          for source in /etc/apt/sources.list.d/*danklinux*.sources; do
            sudo sed -i 's/noble/questing/g' "$source"
          done
          printf '%s\n' \
            'deb http://archive.ubuntu.com/ubuntu/ questing main universe' \
            'deb http://archive.ubuntu.com/ubuntu/ questing-updates main universe' \
            'deb http://security.ubuntu.com/ubuntu questing-security main universe' \
            | sudo tee /etc/apt/sources.list.d/ubuntu-questing.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends quickshell
          command -v sway
          command -v quickshell
          command -v wtype
          command -v grim

      - name: Gates
        run: make ci
