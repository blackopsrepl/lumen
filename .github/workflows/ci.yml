name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Reused by release.yml so a tag cannot publish without passing these gates.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Lumen is a Qt application: it needs Qt 6 with the Wayland compositor
    # modules, a compiler and cmake, and nothing else. There is no Rust
    # toolchain, no browser and no container image to build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Qt and build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-wayland-dev \
            qt6-wayland-dev-tools qt6-base-dev-tools \
            libqt6sql6-sqlite libqt6dbus6 \
            dbus at-spi2-core libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The tests run a compositor and host a real Wayland client, so they need
      # a display stack but never a visible window.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORMTHEME: ""
        run: cd build && ctest --output-on-failure
