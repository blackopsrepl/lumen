<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Lumen</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-state="empty">
    <aside id="sidebar">
      <header class="brand">
        <span class="wordmark">lumen</span>
        <span id="conn-status" class="status">idle</span>
        <span id="conn" class="dot" title="disconnected"></span>
      </header>

      <form id="new-session" class="new" autocomplete="off">
        <input
          id="new-name"
          placeholder="new session"
          spellcheck="false"
          aria-label="new session name"
        />
        <select id="new-kind" aria-label="session type">
          <option value="browser">Browser</option>
          <option value="quickshell">Quickshell</option>
        </select>
        <input
          id="new-path"
          class="path"
          placeholder="shell.qml or directory"
          spellcheck="false"
          aria-label="Quickshell path"
          hidden
        />
        <button type="submit" title="Create session" aria-label="Create session">+</button>
      </form>

      <div class="section">Sessions</div>
      <ul id="sessions" class="sessions"></ul>

      <div class="section">
        Feedback <span id="feedback-count" class="badge" hidden>0</span>
      </div>
      <ul id="feedback-list" class="feedback"></ul>

      <footer class="endpoint">
        <span id="cdp" class="line">not connected</span>
        <span id="attach" class="line attach" hidden></span>
      </footer>
    </aside>

    <main>
      <div id="toolbar" class="toolbar">
        <input
          id="url"
          class="address"
          placeholder="Enter a URL"
          spellcheck="false"
          aria-label="address"
        />
        <span id="page-title" class="page-title"></span>

        <div class="group">
          <button id="zoom-label" class="zoom" title="Actual size — scroll to zoom">100%</button>
          <button id="fit" class="ghost" title="Fit to window">Fit</button>
          <button id="fullscreen" class="icon" title="Fullscreen">⤢</button>
        </div>

        <div class="divider"></div>

        <div class="group">
          <button id="comment" class="ghost" title="Annotate a region">Comment</button>
          <button id="control" class="primary" title="Take over input">Take control</button>
        </div>
      </div>

      <div id="stage">
          <canvas id="screen" tabindex="0" aria-label="session screen"></canvas>
        <canvas id="overlay"></canvas>

        <div id="frame-meta" class="frame-meta" hidden></div>

        <div id="banner" class="banner" hidden>
          <span class="banner-dot"></span>
          You have control — press <kbd>Esc</kbd> to release
        </div>

        <div id="spinner" class="spinner" hidden><span></span></div>

        <div id="empty" class="empty">
          <div class="empty-card">
            <h2>No session selected</h2>
            <p>
              A session is an isolated browser, not an agent. Create one, then an
              agent attaches to it by name with <code>bin/pw.sh -s=&lt;name&gt;</code>.
            </p>
          </div>
        </div>

        <div id="composer" class="composer" hidden>
          <label for="comment-text">Note for the agent</label>
          <textarea
            id="comment-text"
            placeholder="Describe what should change…"
          ></textarea>
          <div class="composer-actions">
            <span class="hint">⌘/Ctrl + Enter to send</span>
            <button id="comment-cancel" class="ghost">Cancel</button>
            <button id="comment-send" class="primary">Send note</button>
          </div>
        </div>
      </div>
    </main>

    <div id="toasts" class="toasts"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
