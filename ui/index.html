<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Lumen</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <h1>Lumen</h1>
        <span id="conn" class="dot" title="disconnected"></span>
      </header>
      <form id="new-session" autocomplete="off">
        <input id="new-name" placeholder="agent name" spellcheck="false" />
        <button type="submit">Add</button>
      </form>
      <ul id="sessions"></ul>
      <section id="feedback">
        <header>Feedback <span id="feedback-count">0</span></header>
        <ul id="feedback-list"></ul>
      </section>
      <footer id="cdp"></footer>
    </aside>

    <main>
      <div id="toolbar">
        <input id="url" placeholder="https://…" spellcheck="false" />
        <button id="go">Go</button>
        <span class="spacer"></span>
        <button id="zoom-out" title="Zoom out">−</button>
        <span id="zoom-label">100%</span>
        <button id="zoom-in" title="Zoom in">+</button>
        <button id="fit" title="Fit to window">Fit</button>
        <button id="one" title="Actual size">1:1</button>
        <button id="fullscreen" title="Fullscreen">⛶</button>
        <button id="comment" title="Annotate a region">Comment</button>
        <button id="control" class="primary">Take control</button>
      </div>
      <div id="stage">
        <canvas id="screen"></canvas>
        <canvas id="overlay"></canvas>
        <div id="empty">Select or create a session</div>
        <div id="composer" hidden>
          <textarea id="comment-text" placeholder="Leave a note for the agent…"></textarea>
          <div class="composer-actions">
            <button id="comment-send" class="primary">Send</button>
            <button id="comment-cancel">Cancel</button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
