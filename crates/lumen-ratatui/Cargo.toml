[package]
name = "lumen-ratatui"
version = "0.0.0"
edition = "2021"
description = "Ratatui backend, event source, and wire protocol for Lumen terminal sessions"
license = "GPL-3.0-or-later"
publish = false

[features]
# The wire protocol is always available; the ratatui-facing backend and event
# source are behind `backend` so the Lumen service can depend on the protocol
# without pulling the widget library in.
default = ["backend"]
backend = ["dep:ratatui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30", default-features = false, optional = true }

[dev-dependencies]
ratatui = { version = "0.30", default-features = false }
